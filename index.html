    <style>
        /* === NEON-VOID BRUTALIST CSS === */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: "Impact", "Arial Black", system-ui, sans-serif;
            font-weight: normal;
            line-height: 1.2;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* === VARIABLES === */
        :root {
            --primary: #000;
            --secondary: #fff;
            --accent: #ff3b00;
            --gap: 48px;
            --padding: 72px;
            --section-gap: 120px;
            --border-w: 4px;
        }

        /* === GLOBAL BRUTALISM === */
        h1, h2, h3, h4 {
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: clamp(3.5rem, 12vw, 7rem);
            line-height: 0.85;
        }

        h2 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
        }

        h3 {
            font-size: clamp(1.8rem, 4vw, 3rem);
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        p, li, blockquote {
            font-family: system-ui, sans-serif;
            font-weight: 300;
            font-size: 1.15rem;
            line-height: 1.5;
        }

        img, svg {
            display: block;
            max-width: 100%;
        }

        /* === SPACING === */
        .wrapper {
            padding-left: var(--padding);
            padding-right: var(--padding);
        }

        section {
            padding-top: var(--section-gap);
            padding-bottom: var(--section-gap);
        }

        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: var(--gap);
        }

        .grid {
            display: grid;
            gap: var(--gap);
        }

        /* === HEADER === */
        header {
            padding: 24px var(--padding);
            border-bottom: var(--border-w) solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            letter-spacing: -0.05em;
            color: var(--secondary);
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 36px;
        }

        nav a {
            color: var(--secondary);
            font-size: 1.1rem;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
        }

        nav a:hover {
            border-bottom-color: var(--accent);
        }

        /* === HAMBURGER (CSS only) === */
        .hamburger {
            display: none;
            appearance: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 100;
        }

        .hamburger span {
            display: block;
            width: 32px;
            height: 4px;
            background: var(--secondary);
            margin: 7px 0;
            transition: 0.3s;
        }

        .menu-toggle {
            display: none;
        }

        .overlay {
            display: none;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            nav {
                position: fixed;
                top: 0;
                right: 0;
                width: 70%;
                max-width: 320px;
                height: 100vh;
                background: #111;
                border-left: var(--border-w) solid var(--accent);
                flex-direction: column;
                justify-content: center;
                gap: 32px;
                padding: 48px 32px;
                transform: translateX(100%);
                transition: transform 0.4s ease;
                z-index: 99;
            }

            nav a {
                font-size: 1.8rem;
            }

            .menu-toggle:checked ~ nav {
                transform: translateX(0);
            }

            .menu-toggle:checked ~ .overlay {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.7);
                z-index: 98;
            }

            .hamburger:has(+ .menu-toggle:checked) span:nth-child(1) {
                transform: rotate(45deg) translate(8px, 8px);
            }
            .hamburger:has(+ .menu-toggle:checked) span:nth-child(2) {
                opacity: 0;
            }
            .hamburger:has(+ .menu-toggle:checked) span:nth-child(3) {
                transform: rotate(-45deg) translate(8px, -8px);
            }

            .wrapper {
                padding-left: 24px;
                padding-right: 24px;
            }

            section {
                padding-top: 72px;
                padding-bottom: 72px;
            }

            :root {
                --padding: 24px;
                --section-gap: 72px;
                --gap: 32px;
            }
        }

        /* === HERO === */
        .hero {
            background: var(--primary);
            border-bottom: var(--border-w) solid var(--accent);
            position: relative;
            overflow: hidden;
        }

        .hero-inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 48px;
            position: relative;
            z-index: 2;
        }

        .hero-text {
            flex: 2 1 400px;
        }

        .hero-text h1 {
            margin-bottom: 24px;
            transform: skew(-6deg);
            transform-origin: left;
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            padding: 0 16px;
            margin-left: -16px;
        }

        .hero-sub {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 32px;
            font-family: "Impact", "Arial Black", system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero-cta {
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            padding: 18px 48px;
            font-size: 2rem;
            font-family: "Impact", "Arial Black", system-ui, sans-serif;
            text-transform: uppercase;
            border: var(--border-w) solid var(--secondary);
            transform: rotate(-2deg);
            transition: 0.2s;
        }

        .hero-cta:hover {
            transform: rotate(0deg) scale(1.02);
            background: var(--secondary);
            color: var(--accent);
            border-color: var(--accent);
            text-decoration: none;
        }

        .hero-visual {
            flex: 1 1 300px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            transform: rotate(4deg);
        }

        .hero-visual > div {
            aspect-ratio: 1;
            background: var(--accent);
            border: var(--border-w) solid var(--secondary);
        }

        .hero-visual > div:nth-child(2) {
            background: var(--secondary);
            border-color: var(--accent);
            margin-top: -32px;
        }

        .hero-visual > div:nth-child(3) {
            background: var(--secondary);
            border-color: var(--accent);
            margin-left: -32px;
        }

        .hero-visual > div:nth-child(4) {
            background: var(--accent);
            border-color: var(--secondary);
        }

        /* === SECTION INTRO === */
        .intro {
            border-bottom: var(--border-w) solid var(--accent);
        }

        .intro-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 64px 48px;
        }

        .intro-grid h2 {
            grid-column: 1 / -1;
            transform: skew(-4deg);
            background: var(--accent);
            color: var(--primary);
            padding: 8px 24px;
            margin-left: -24px;
            width: fit-content;
        }

        .intro-box {
            border: var(--border-w) solid var(--accent);
            padding: 32px;
            background: #111;
        }

        .intro-box h3 {
            color: var(--accent);
            margin-bottom: 16px;
        }

        .intro-box ul {
            list-style: none;
        }

        .intro-box li {
            padding: 8px 0;
            border-bottom: 2px solid #222;
        }

        .intro-box li:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .intro-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }
        }

        /* === REVIEWS === */
        .reviews {
            border-bottom: var(--border-w) solid var(--accent);
        }

        .reviews h2 {
            margin-bottom: 48px;
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            padding: 4px 32px;
            transform: skew(6deg);
            margin-left: -16px;
        }

        .review-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 48px;
        }

        .review-card {
            background: var(--secondary);
            color: var(--primary);
            border: var(--border-w) solid var(--accent);
            padding: 32px 24px;
            transform: rotate(var(--rot, 0deg));
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }

        .review-card:nth-child(odd) {
            --rot: -2deg;
        }

        .review-card:nth-child(even) {
            --rot: 3deg;
        }

        .review-card:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .review-name {
            font-weight: bold;
            color: var(--accent);
        }

        .review-date {
            font-size: 0.85rem;
            opacity: 0.6;
            font-family: system-ui, sans-serif;
        }

        .review-stars {
            color: var(--accent);
            font-size: 1.6rem;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .review-text {
            font-family: system-ui, sans-serif;
            line-height: 1.6;
            flex: 1;
        }

        /* === CTA SECTION === */
        .cta {
            border-bottom: var(--border-w) solid var(--accent);
            text-align: center;
        }

        .cta h2 {
            margin-bottom: 32px;
            transform: skew(-5deg);
        }

        .cta .hero-cta {
            font-size: 2.5rem;
            transform: rotate(2deg);
        }

        .cta .hero-cta:hover {
            transform: rotate(0deg);
        }

        /* === FOOTER === */
        footer {
            padding: 48px var(--padding);
            border-top: var(--border-w) solid var(--accent);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        footer .copyright {
            font-family: system-ui, sans-serif;
            font-size: 0.95rem;
            opacity: 0.7;
        }

        footer .footer-phone {
            font-size: 1.5rem;
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 8px 24px;
        }

        footer .footer-phone:hover {
            background: var(--accent);
            color: var(--primary);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            footer {
                flex-direction: column;
                text-align: center;
            }
        }

        /* === UTILITY === */
        .no-wrap {
            white-space: nowrap;
        }

        .accent-bg {
            background: var(--accent);
            color: var(--primary);
        }

        .skew-neg {
            transform: skew(-4deg);
        }

        .skew-pos {
            transform: skew(4deg);
        }

        /* === ASYMMETRIC EXTRA === */
        .intro-box:first-of-type {
            margin-top: 48px;
        }

        .intro-box:last-of-type {
            margin-bottom: 48px;
        }

        /* negative margin samples in layout */
        .hero .hero-visual {
            margin-top: -24px;
            margin-right: -24px;
        }

        @media (max-width: 768px) {
            .hero .hero-visual {
                margin: 0;
                transform: rotate(0deg);
            }
            .hero-text h1 {
                transform: skew(0);
                margin-left: 0;
            }
        }
    </style>
